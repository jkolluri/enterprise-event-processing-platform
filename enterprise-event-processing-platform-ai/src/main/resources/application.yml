spring:
  application:
    name: enterprise-event-processing-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventdb}
    username: ${DB_USERNAME:eventuser}
    password: ${DB_PASSWORD:eventpass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: event-platform
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  kafka:
    event-topic: ${EVENT_TOPIC:business-events}
  ai:
    enabled: ${AI_ENABLED:true}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5-mini}
  security:
    demo-user: ${DEMO_USER:admin}
    demo-password: ${DEMO_PASSWORD:admin123}
    jwt-secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-1234567890}
