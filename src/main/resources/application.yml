spring:
  application:
    name: enterprise-event-processing-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventdb}
    username: ${DB_USERNAME:eventuser}
    password: ${DB_PASSWORD:eventpass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: event-platform
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  circuitbreaker:
    instances:
      openai:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      openai:
        max-attempts: 2
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-to-a-very-long-production-secret}
    expiration-ms: 86400000
  kafka:
    topic: ${APP_KAFKA_TOPIC:event-processing-topic}
    event-topic: ${EVENT_TOPIC:business-events}
  ai:
    enabled: ${AI_ENABLED:true}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5-mini}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:15000}
    max-payload-chars: ${AI_MAX_PAYLOAD_CHARS:10000}
    rag:
      enabled: ${AI_RAG_ENABLED:true}
      max-content-chars: ${AI_RAG_MAX_CONTENT_CHARS:20000}
  security:
    demo-user: ${DEMO_USER:admin}
    demo-password: ${DEMO_PASSWORD:admin123}
    jwt-secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-1234567890}